<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proxy Coach prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  /* Tokens. Serif is the coach's voice; sans is the software. */
  :root {
    --paper: #F6F7F9; --panel: #ECEFF3; --field: #FFFFFF; --ink: #1B2430; --muted: #566170;
    --rule: #D6DBE2; --brass: #8C6A2E; --link: #2E5E86; --ok: #2F7D4F; --warn: #B3412E;
    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --bar-height: 3.5rem;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151A21; --panel: #1C232C; --field: #10151B; --ink: #E5E8ED; --muted: #A2ABB8;
      --rule: #2E3743; --brass: #C9A35A; --link: #8FB7DD; --ok: #6FC28F; --warn: #E58A76;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #151A21; --panel: #1C232C; --field: #10151B; --ink: #E5E8ED; --muted: #A2ABB8;
    --rule: #2E3743; --brass: #C9A35A; --link: #8FB7DD; --ok: #6FC28F; --warn: #E58A76;
    color-scheme: dark;
  }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4rem); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  button { font-family: var(--sans); }
  .coach { font-family: var(--serif); font-size: 1.04rem; line-height: 1.6; }

  /* Header */
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .bar-inner { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.6rem 1.1rem; flex-wrap: wrap; }
  .brand { font-weight: 750; font-stretch: 80%; font-size: 1.25rem; }
  .brand small { font-weight: 500; font-stretch: 100%; color: var(--muted); font-size: 0.85rem; margin-left: 0.5rem; }
  .bar-tools { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  select, input, textarea { font-family: var(--sans); font-size: 0.95rem; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 0.45rem 0.55rem; }
  textarea { font-family: var(--serif); font-size: 1rem; line-height: 1.5; width: 100%; min-height: 8rem; resize: vertical; }
  .btn { font-size: 0.92rem; font-weight: 600; padding: 0.45rem 0.85rem; border-radius: 4px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
  .btn.quiet { background: transparent; color: var(--ink); border-color: var(--rule); }
  .btn.small { font-size: 0.85rem; padding: 0.3rem 0.6rem; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Shell */
  .shell { display: grid; grid-template-columns: 12.5rem 1fr; min-height: calc(100vh - var(--bar-height)); }
  .side { border-right: 1px solid var(--rule); padding: 1rem 0.6rem; }
  .side button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); font-size: 0.97rem; font-weight: 600; padding: 0.5rem 0.65rem; border-radius: 4px; cursor: pointer; margin-bottom: 0.15rem; }
  .side button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: inset 3px 0 0 var(--brass); }
  .side .group { font-size: 0.8rem; color: var(--muted); margin: 1rem 0.65rem 0.35rem; font-weight: 600; }
  .side .count { float: right; font-variant-numeric: tabular-nums; color: var(--brass); }
  main { padding: 1.5rem 1.5rem 5rem; max-width: 64rem; width: 100%; }
  main, .grid2 > *, .form > * { min-width: 0; }
  h1 { font-stretch: 80%; font-weight: 750; font-size: clamp(1.7rem, 4.5vw, 2.4rem); line-height: 1.08; margin: 0 0 0.5rem; }
  h2 { font-stretch: 88%; font-weight: 700; font-size: 1.3rem; margin: 2rem 0 0.6rem; }
  h3 { font-weight: 650; font-size: 1.05rem; margin: 0 0 0.35rem; }
  p { margin: 0 0 0.8rem; max-width: 70ch; }
  .muted { color: var(--muted); }
  .fine { font-size: 0.85rem; color: var(--muted); }
  .badge { display: inline-block; font-size: 0.74rem; font-weight: 600; padding: 0.08rem 0.42rem; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted); vertical-align: middle; margin-left: 0.35rem; white-space: nowrap; }
  .badge.ai { border-color: var(--brass); color: var(--brass); }
  .badge.warn { border-color: var(--warn); color: var(--warn); }
  .badge.ok { border-color: var(--ok); color: var(--ok); }

  /* Goals */
  .goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 1rem 0 0.5rem; }
  .goal span { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--muted); }
  .goal strong { color: var(--ink); font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; margin-top: 0.3rem; }
  .fill { height: 100%; background: var(--brass); transition: width 220ms ease; }

  /* The day plan: a real sequence in time, so it's a timeline */
  .timeline { list-style: none; margin: 0.5rem 0 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 5.2rem 1fr; gap: 0 1rem; position: relative; }
  .timeline .time { font-weight: 700; color: var(--brass); font-variant-numeric: tabular-nums; padding-top: 0.85rem; text-align: right; font-size: 0.92rem; }
  .timeline .body { border-left: 2px solid var(--rule); padding: 0.75rem 0 1rem 1.1rem; position: relative; }
  .timeline .body::before { content: ""; position: absolute; left: -7px; top: 1.05rem; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 2px solid var(--brass); }
  .timeline li.done .body::before { background: var(--brass); }
  .timeline li.done .title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .timeline .title { font-weight: 650; font-size: 1.02rem; }
  .timeline .why { margin: 0.2rem 0 0.4rem; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .check { display: inline-flex; gap: 0.4rem; align-items: center; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .check input { width: 1.05rem; height: 1.05rem; accent-color: var(--brass); }
  .note { border-left: 3px solid var(--brass); padding: 0.4rem 0 0.4rem 0.9rem; margin: 0.75rem 0 1rem; }

  /* Pipeline */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(13.5rem, 1fr); gap: 0.75rem; overflow-x: auto; padding-bottom: 0.5rem; }
  .col { background: var(--panel); border-radius: 6px; padding: 0.6rem; min-height: 10rem; }
  .col h3 { font-size: 0.95rem; display: flex; justify-content: space-between; }
  .col h3 span { color: var(--muted); font-variant-numeric: tabular-nums; }
  .card { display: block; width: 100%; text-align: left; background: var(--field); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 0.6rem 0.65rem; margin-bottom: 0.5rem; cursor: pointer; font-size: 0.9rem; }
  .card .nm { font-weight: 650; font-size: 0.97rem; }
  .card .nx { color: var(--muted); margin-top: 0.2rem; }
  .card .fl { margin-top: 0.35rem; }

  /* Panels */
  .panel { background: var(--field); border: 1px solid var(--rule); border-radius: 6px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
  .kv { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .kv td { padding: 0.4rem 0.6rem 0.4rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .kv td:first-child { font-weight: 600; color: var(--muted); white-space: nowrap; width: 38%; }
  .kv .src { display: block; font-size: 0.78rem; color: var(--muted); }
  ul.tight { margin: 0.25rem 0 0.5rem; padding-left: 1.1rem; }
  ul.tight li { margin-bottom: 0.3rem; }
  .objection { margin: 0 0 0.6rem; }
  .objection .q { font-weight: 650; }
  .prep-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
  .goalline { font-weight: 650; }

  /* Practice */
  .chat { display: flex; flex-direction: column; gap: 0.6rem; margin: 0.75rem 0; }
  .bubble { max-width: 80%; padding: 0.6rem 0.8rem; border-radius: 10px; font-family: var(--serif); line-height: 1.5; }
  .bubble.client { background: var(--panel); align-self: flex-start; border-bottom-left-radius: 3px; }
  .bubble.agent { background: var(--ink); color: var(--paper); align-self: flex-end; border-bottom-right-radius: 3px; }
  .bubble .who { display: block; font-family: var(--sans); font-size: 0.75rem; font-weight: 600; opacity: 0.75; margin-bottom: 0.15rem; }
  .feedback { align-self: flex-end; max-width: 80%; font-size: 0.92rem; border-left: 3px solid var(--rule); padding: 0.2rem 0 0.2rem 0.7rem; }
  .feedback.strong { border-left-color: var(--ok); }
  .feedback.weak { border-left-color: var(--warn); }
  .feedback b { font-family: var(--sans); }
  .options { display: grid; gap: 0.5rem; margin-top: 0.5rem; }
  .options button { text-align: left; font-family: var(--serif); font-size: 1rem; line-height: 1.45; padding: 0.6rem 0.75rem; border-radius: 6px; border: 1px solid var(--rule); background: var(--field); color: var(--ink); cursor: pointer; }
  .options button:hover { border-color: var(--brass); }
  .scorebig { font-size: 2.6rem; font-weight: 750; font-stretch: 80%; font-variant-numeric: tabular-nums; line-height: 1; }

  /* Skills */
  .skill { display: grid; grid-template-columns: 11rem 1fr 4.5rem; gap: 0.75rem; align-items: center; padding: 0.45rem 0; border-bottom: 1px solid var(--rule); }
  .pips { display: flex; gap: 4px; }
  .pips i { flex: 1; height: 8px; border-radius: 2px; background: var(--rule); }
  .pips i.on { background: var(--brass); }
  .skill b { text-align: right; font-size: 0.9rem; font-variant-numeric: tabular-nums; }

  /* Tiles and tables */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.75rem; margin: 0.75rem 0 1rem; }
  .tile { border-top: 3px solid var(--brass); background: var(--field); padding: 0.65rem 0.75rem; }
  .tile span { display: block; color: var(--muted); font-size: 0.85rem; }
  .tile strong { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .tablewrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  table.data th { text-align: left; font-size: 0.85rem; color: var(--muted); font-weight: 600; padding: 0 0.75rem 0.4rem 0; border-bottom: 2px solid var(--ink); white-space: nowrap; }
  table.data td { padding: 0.55rem 0.75rem 0.55rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  table.data td.num { font-variant-numeric: tabular-nums; }

  /* Coach drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(26rem, 100%); background: var(--field); border-left: 1px solid var(--rule); z-index: 30; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: -8px 0 24px rgba(0,0,0,0.12); }
  .drawer[hidden] { display: none; }
  .drawer header { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1rem; border-bottom: 1px solid var(--rule); }
  .drawer .msgs { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .drawer .msg { max-width: 92%; padding: 0.55rem 0.75rem; border-radius: 10px; line-height: 1.5; }
  .drawer .msg.coach { background: var(--panel); align-self: flex-start; font-family: var(--serif); }
  .drawer .msg.me { background: var(--ink); color: var(--paper); align-self: flex-end; }
  .drawer .msg .src { display: block; font-family: var(--sans); font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }
  .drawer .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0 1rem 0.6rem; }
  .drawer .chips button { font-size: 0.82rem; border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 999px; padding: 0.3rem 0.6rem; cursor: pointer; text-align: left; }
  .drawer form { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-top: 1px solid var(--rule); }
  .drawer form input { flex: 1; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 0.65rem 0.95rem; border-radius: 6px; font-size: 0.95rem; display: none; z-index: 40; max-width: calc(100% - 2rem); }
  .toast.show { display: block; }

  .tracks { display: flex; gap: 0.35rem; flex-wrap: wrap; border-bottom: 2px solid var(--ink); margin: 0.25rem 0 1rem; }
  .tracks button { border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 0.97rem; padding: 0.5rem 0.85rem; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
  .tracks button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
  .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 0 0 0.9rem; }
  .filters button { border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 999px; padding: 0.3rem 0.7rem; font-size: 0.85rem; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .brief { background: var(--field); border: 1px solid var(--rule); border-left: 3px solid var(--brass); border-radius: 0 6px 6px 0; padding: 0.9rem 1rem; margin-bottom: 0.9rem; }
  .brief .date { font-size: 0.85rem; color: var(--muted); margin: 0.1rem 0 0.5rem; }
  .brief .lbl { font-weight: 650; font-size: 0.88rem; margin: 0.5rem 0 0.1rem; color: var(--muted); }
  .brief p { margin-bottom: 0.4rem; }
  .brief .src { font-size: 0.85rem; margin-top: 0.4rem; }
  .brief .src a { margin-right: 0.8rem; }
  .articles { list-style: none; margin: 0 0 1rem; padding: 0; }
  .articles li { padding: 0.6rem 0; border-bottom: 1px solid var(--rule); }
  .articles a { font-weight: 650; color: var(--link); text-underline-offset: 0.15em; }
  .articles .meta { font-size: 0.85rem; color: var(--muted); }
  .quiz .count { font-size: 0.85rem; color: var(--muted); }
  .quiz .q { font-family: var(--serif); font-size: 1.12rem; line-height: 1.45; margin: 0.25rem 0 0.75rem; }
  .quiz .opts { display: grid; gap: 0.5rem; }
  .quiz .opts button { text-align: left; padding: 0.6rem 0.75rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--field); color: var(--ink); font-family: var(--serif); font-size: 1rem; line-height: 1.45; cursor: pointer; }
  .quiz .opts button:hover:not(:disabled) { border-color: var(--brass); }
  .quiz .opts button:disabled { cursor: default; }
  .quiz .opts button.right { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
  .quiz .opts button.wrong { border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
  .quiz .fb { margin-top: 0.75rem; }
  .quiz .review li { margin-bottom: 0.6rem; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 0.9rem; }
  .form .full { grid-column: 1 / -1; }
  .form label { display: block; font-size: 0.86rem; font-weight: 600; margin-bottom: 0.2rem; }
  .form input, .form select, .form textarea { width: 100%; }
  .form .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
  .docs label { display: flex; gap: 0.5rem; align-items: flex-start; margin: 0.3rem 0; font-size: 0.95rem; cursor: pointer; }
  .docs input { margin-top: 0.2rem; accent-color: var(--brass); }
  .checks { list-style: none; margin: 0.5rem 0 0.75rem; padding: 0; }
  .checks li { display: grid; grid-template-columns: 1.4rem 1fr; gap: 0.4rem; padding: 0.45rem 0; border-bottom: 1px solid var(--rule); font-size: 0.95rem; }
  .checks .mk { font-weight: 800; }
  .checks .pass .mk { color: var(--ok); }
  .checks .fail .mk { color: var(--warn); }
  .checks .msg { display: block; color: var(--muted); font-size: 0.88rem; }
  .calc { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .calc td { padding: 0.4rem 0; border-bottom: 1px solid var(--rule); }
  .calc td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .calc tr.total td { font-weight: 750; font-size: 1.05rem; border-top: 2px solid var(--ink); border-bottom: 0; }
  .pill { font-size: 0.8rem; font-weight: 600; padding: 0.08rem 0.45rem; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
  .pill.good { border-color: var(--ok); color: var(--ok); }
  .pill.wait { border-color: var(--brass); color: var(--brass); }
  .pill.bad { border-color: var(--warn); color: var(--warn); }
  .steplist { list-style: none; margin: 0 0 1rem; padding: 0; }
  .steplist li { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: 0.5rem; align-items: start; padding: 0.6rem 0; border-bottom: 1px solid var(--rule); }
  .steplist input { margin-top: 0.25rem; width: 1.05rem; height: 1.05rem; accent-color: var(--brass); cursor: pointer; }
  .steplist .st { font-weight: 650; }
  .steplist .how { font-family: var(--serif); font-size: 0.98rem; color: var(--muted); margin: 0.1rem 0 0; }
  .steplist li.done .st { color: var(--muted); }
  .approval { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; padding: 0.7rem 0; border-bottom: 1px solid var(--rule); }
  .error { color: var(--warn); font-size: 0.9rem; margin: 0.4rem 0 0; min-height: 1.2em; }
  @media (max-width: 860px) {
    .form { grid-template-columns: 1fr; }
    .steplist li { grid-template-columns: 1.6rem 1fr; }
    .steplist li .act { grid-column: 2; }
    .approval { grid-template-columns: 1fr; }
    .shell { grid-template-columns: 1fr; }
    .side { border-right: 0; border-bottom: 1px solid var(--rule); padding: 0.4rem 0.6rem; display: flex; gap: 0.25rem; overflow-x: auto; white-space: nowrap; }
    .side .group { display: none; }
    .side button { display: inline-block; width: auto; margin: 0; }
    .side .count { float: none; margin-left: 0.3rem; }
    .side button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--brass); }
    main { padding: 1.1rem 1rem 5rem; }
    .grid2, .goals { grid-template-columns: 1fr; }
    .timeline li { grid-template-columns: 4.3rem 1fr; gap: 0 0.7rem; }
    .skill { grid-template-columns: 1fr 4rem; }
    .skill .pips { grid-column: 1 / -1; order: 3; }
    .bubble, .feedback { max-width: 95%; }
  }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div class="brand">Proxy Coach<small>Prototype with sample data</small></div>
    <div class="bar-tools">
      <label for="role" class="fine">Viewing as</label>
      <select id="role">
        <option value="agent">Jamie L., agent</option>
        <option value="manager">Ryan, managing broker</option>
      </select>
      <button type="button" class="btn" id="openCoach">Ask your coach</button>
      <button type="button" class="btn quiet" id="reset">Reset demo</button>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="side" id="nav" aria-label="Screens"></nav>
  <main id="view" tabindex="-1"></main>
</div>

<aside class="drawer" id="drawer" aria-label="Ask your coach" hidden>
  <header><strong>Ask your coach</strong><button type="button" class="btn quiet small" id="closeCoach">Close</button></header>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="askForm"><input id="askInput" type="text" placeholder="Ask about a call, an objection or your week" aria-label="Your question" autocomplete="off"><button class="btn" type="submit">Ask</button></form>
</aside>

d":"yes","cobroke":"0","referral":"0","split":"80","fee":"50","docs":{"contract":false,"agency":false,"fare":false}},"onboarding":[{"phase":"First week: get active at Proxy","items":[{"id":"o1","title":"Move your license to Proxy","how":"Your previous broker files a termination in eAccessNY, then Proxy files the change of association. Upload the confirmation here."},{"id":"o2","title":"Sign your agreement and commission plan","how":"Your split and fees are saved to your profile and used automatically on every commission slip.","tool":"slips","toolName":"Open commission slips"},{"id":"o3","title":"Set up commission payments","how":"Add your W-9 and direct deposit so approved slips can be paid."},{"id":"o4","title":"Get your Proxy email, phone and listing logins","how":"Includes the listing services Proxy uses and Proxy's AI platform."},{"id":"o5","title":"Update your cards, email signature and social profiles","how":"New York's advertising rules apply to all of them: show your license type, Proxy's name and the office phone."}]},{"phase":"Weeks 1 and 2: work the Proxy way","items":[{"id":"o6","title":"Read Proxy's standardized operating procedures","how":"New York requires every brokerage to have them, and you apply them the same way to every buyer and renter."},{"id":"o7","title":"Learn Proxy's FARE Act process for rentals","how":"Who pays the broker fee, and how every tenant fee is disclosed in listings and leases."},{"id":"o8","title":"Set up your disclosure forms","how":"The agency disclosure and the Housing and Anti-Discrimination Disclosure, ready to send at first contact."},{"id":"o9","title":"Build your first listing in the listing builder","how":"It checks fees, fair housing language and advertising rules before Ryan approves it.","tool":"listings","toolName":"Open listing builder"},{"id":"o10","title":"Submit a practice commission slip","how":"See your share before you submit, and how approval and payment work.","tool":"slips","toolName":"Open commission slips"}]},{"phase":"Weeks 2 to 4: start producing","items":[{"id":"o11","title":"Import your contacts","how":"The coach only drafts messages on channels each contact has agreed to."},{"id":"o12","title":"Reach 25 conversations from Proxy leads","how":"Your plan on Today ranks who to call first."},{"id":"o13","title":"Get your first Proxy listing live","how":"Built, checked and approved in the listing builder."},{"id":"o14","title":"Submit your first commission slip","how":"Within a day of the lease or contract being signed."},{"id":"o15","title":"30-day check-in with Ryan","how":"Review your numbers, your listings and the skill to focus on next."}]}],"lessons":[{"skill":"commission","title":"Hold your fee by showing what it buys","minutes":8,"scenario":"s4","points":["Lay out exactly what your fee covers before discussing the number.","Compare outcomes, not percentages: what the seller nets after the fee.","If you adjust, tie it to a change in what you provide, and put it in writing."]},{"skill":"objections","title":"Turn \u201cwhy pay a broker\u201d into a value conversation","minutes":8,"scenario":"s1","points":["State the rule in one line: whoever hires the broker pays.","Move straight to what you'll do and how fast.","Put the fee and what it covers in writing."]},{"skill":"listing","title":"Price with comparable sales, not opinions","minutes":10,"scenario":"s2","points":["Show recent nearby sales before you give a number.","Recommend a range and explain each reason.","End with a dated plan: photos, listing day, first open house."]},{"skill":"negotiation","title":"Compare offers on terms, not just price","minutes":8,"scenario":"s5","points":["Lay out price, financing, contingencies and timing side by side.","For co-ops, check the buyer's finances against the board's requirements before accepting.","Give a written recommendation, and let the seller decide."]},{"skill":"followup","title":"Follow-ups that get replies","minutes":6,"scenario":"s3","points":["Send something new, not a check-in.","Offer two specific times.","Keep it short enough to answer in one line."]}],"fairHousing":[["young professional","Describes who should live there, not the home. Describe the layout, light or commute instead."],["perfect for singles","Describes people, not the home."],["no kids","Excluding children breaks fair housing law."],["no children","Excluding children breaks fair housing law."],["adults only","Excluding families breaks fair housing law unless it's qualified senior housing."],["no section 8","New York bans discrimination based on lawful source of income, including vouchers."],["no vouchers","New York bans discrimination based on lawful source of income, including vouchers."],["exclusive neighborhood","Can read as a preference about who lives nearby. Describe amenities instead."]],"adFooter":"Listed by Jamie L., Licensed Real Estate Salesperson, Proxy Real Estate. Office: (212) 555-0100.","buildings":{"100 Sample Street, Brooklyn":[["Size","6 apartments","PLUTO lot data"],["Built","1931","PLUTO lot data"],["Last recorded sale","March 2019, $2.1M","ACRIS property records"],["Open violations","3","HPD violations"],["Similar apartments nearby","$2,700 to $3,300 a unit","Proxy's comparable rents"]],"75 Placeholder Boulevard, Manhattan":[["Size","4 apartments over 2 storefronts","PLUTO lot data"],["Built","1910","PLUTO lot data"],["Last recorded sale","November 2015, $5.8M","ACRIS property records"],["Open violations","0","HPD violations"],["Recent permits","1 in the past year (storefront)","DOB permits"]],"250 Demo Avenue, Queens":[["Size","8 apartments","PLUTO lot data"],["Listed units","2, with 14 inquiries so far","Proxy listings"],["Open violations","1","HPD violations"]],"40 Example Place, Bronx":[["Size","Converting to 12 apartments","DOB permits"],["Open violations","7","HPD violations"]]},"prep":{"c1":{"situation":"Jordan was asked for a $4,500 fee on a $3,200 apartment listed by the landlord's broker. Under the FARE Act, that fee estion is whether I fill your units faster, with better tenants, than you could alone. Here's my plan and my fee, in writing."]],"compliance":["Put the fee and what it covers in writing before she signs.","Screen every applicant on the same criteria."],"goal":"Book a walk-through of the vacant units.","scenario":"s1"},"c3":{"situation":"Grace owns 75 Placeholder Boulevard in Manhattan, with 4 apartments over 2 storefronts, and wants to lease a vacant storefront now.","facts":[["Size","4 apartments over 2 storefronts","PLUTO lot data"],["Built","1910","PLUTO lot data"],["Last recorded sale","November 2015, $5.8M","ACRIS property records"],["Open violations","0","HPD violations"],["Recent permits","1 in the past year (storefront)","DOB permits"]],"talk":["Ask what kind of tenant fits the block and the storefront's size.","Bring in Proxy's commercial agent for the storefront, and offer help with the apartments.","Propose a site visit this week."],"questions":["What did the last tenant pay, and why did they leave?","Are there uses you'd rule out?","How soon do you want it filled?"],"objections":[["\u201cI've already listed it online myself.\u201d","That's a good start. I can add showings, screening and a weekly report on every inquiry, so you can see exactly what's happening."]],"compliance":["Confirm the fee and who pays it, in writing."],"goal":"Book a site visit this week.","scenario":"s1"},"c4":{"situation":"Omar is looking for a 2-bedroom in Crown Heights with a roommate, around $2,800 a month. His showing is Thursday at 6:00 pm.","facts":[["Budget","$2,800 a month","Opt-in form"],["Area","Crown Heights","Opt-in form"],["Showing","Thursday, 6:00 pm","Your calendar"]],"talk":["Confirm the showing a day ahead.","Ask whether the roommate can come too.","Bring the application checklist so they can apply on the spot."],"questions":["Will both of you be on the lease?","Any must-haves we haven't covered?"],"objections":[["\u201cCan we wait to apply?\u201d","Of course. If you love one, I'll have everything ready so you can move quickly."]],"compliance":["Apply the same application requirements to every renter."],"goal":"Leave with an application if they love one.","scenario":"s3"},"c5":{"situation":"Chris wants to sell his 2-bedroom co-op at 1 Demo Court, Jackson Heights, within three months and thinks it's worth $650K. Your listing presentation is tomorrow at 3:00 pm.","facts":[["Home","2-bedroom co-op","Chris"],["Similar sales, last 6 months","$575K to $620K","ACRIS property records (sample)"],["Typical time on market","About 6 weeks","Proxy listings (sample)"],["Building","Board approval required","Co-op"]],"talk":["Start with what's sold nearby, including the highest sale, before you give your number.","Recommend a range with reasons, and show what happens to listings priced too high.","Close with a dated plan: photos this week, live next Monday."],"questions":["What's driving the three-month timeline?","What work has been done on the apartment?","How quickly has the board approved recent sales?"],"objections":[["\u201cMy neighbor sold for more.\u201d","Let's look at that sale next to yours, including size, floor and condition, so we price on facts."]],"compliance":["Use comparable sales from public records, and label any estimate as an estimate."],"goal":"Sign the listing agreement with an agreed price range.","scenario":"s2"},"c6":{"situation":"Leo wants a studio in Bushwick near the L train for about $2,400 a month. He hasn't replied in 6 days after you sent two listings.","facts":[["Budget","$2,400 a month","Commute map opt-in"],["Area","Bushwick, near the L train","Commute map opt-in"],["Last contact","6 days ago","Your call log"]],"talk":["Send something new, not a check-in.","Offer two specific times.","Keep it short and easy to say yes to."],"questions":["Is the budget the same?","Has the timing changed?"],"objections":[["\u201cI'm too busy this week.\u201d","No problem. Would Saturday morning work, or should I check back next week?"]],"compliance":["He's opted in to email only, so don't text him."],"goal":"Get a viewing on the calendar.","scenario":"s3"},"c9":{"situation":"Marcus's 2 apartments at 250 Demo Avenue are listed, with 14 inquiries so far.","facts":[["Size","8 apartments","PLUTO lot data"],["Listed units","2, with 14 inquiries so far","Proxy listings"],["Open violations","1","HPD violations"]],"talk":["Send his weekly report on inquiries, showings and feedback.","Recommend a next step if showings aren't turning into applications."],"questions":["What would make this go more smoothly for you?"],"objections":[],"compliance":["Keep every fee and agreement in writing."],"goal":"Keep him informed every week.","scenario":"s3"},"c10":{"situation":"Sofia's 1-bedroom condo purchase closes in about five weeks.","facts":[],"talk":["Track the lender and attorney deadlines.","Check in weekly so nothing slips."],"questions":["What would make this go more smoothly for you?"],"objections":[],"compliance":["Keep every fee and agreement in writing."],"goal":"Close on time.","scenario":"s3"},"c8":{"situation":"Hannah signed an exclusive to lease 4 converted units at 40 Example Place.","facts":[["Size","Converting to 12 apartments","DOB permits"],["Open violations","7","HPD violations"]],"talk":["Agree on the leasing timeline.","Ask whether she knows other owners who need help."],"questions":["What would make this go more smoothly for you?"],"objections":[],"compliance":["Keep every fee and agreement in writing."],"goal":"Get one referral.","scenario":"s3"},"c7":{"situation":"Nina chose another agent last week.","facts":[],"talk":["Thank her and ask what made the difference.","Offer to stay in touch for her next move."],"questions":["What would make this go more smoothly for you?"],"objections":[],"compliance":["Keep every fee and agreement in writing."],"goal":"Learn one thing to do better next time.","scenario":"s3"}},"scenarios":{"s1":{"title":"\u201cWhy should I pay a broker?\u201d","who":"Landlord","skill":"objections","track":"rentals","intro":"You're calling a landlord with two vacant apartments who is unhappy about the new fee rules.","turns":[{"client":"Before the new law, tenants paid the broker. Why should I pay you now?","options":[["That's the law now, so you don't really have a choice.",0,"Accurate but cold. It makes the law the reason instead of your value."],["Fair question. Under the FARE Act, whoever hires the broker pays. So the real question is whether I fill your units faster, with better tenants, than you could alone. Can I show you how?",3,"You acknowledged the concern, explained the rule in one line and moved to value with a clear next step."],["Most landlords just raise the rent a little to cover it.",1,"It may happen, but it sounds like advice on passing your fee to tenants, which can read badly."]]},{"client":"What would you actually do that I can't do with a listing site?","options":[["Honestly, a lot of it is the same, but we're good at it.",0,"Too modest. Give specifics they can picture."],["We list everywhere, run the showings, screen applicants and handle the lease, and you get a weekly report on every inquiry and where it came from.",3,"Concrete and transparent. The weekly report answers what they're really worried about: what am I paying for?"],["We have a lot of agents.",1,"True, but it's about you, not them."]]},{"client":"Okay. What's the fee?","options":[["It depends. Let's talk about it later.",0,"Dodging the fee breaks trust. Proxy shows fees up front."],["Let me check with my manager and get back to you.",1,"Fine if you truly don't know, but know your fee before the call."],["Here's our fee in writing and exactly what it covers. If it makes sense, I can have the units listed this week.",3,"Clear, written and paired with a next step."]]}]},"s2":{"title":"A seller who wants to overprice","who":"Seller","skill":"listing","track":"sales","intro":"You're presenting to a seller who has a number in mind that recent sales don't support.","turns":[{"client":"A neighbor sold for $640K last spring, so I want to list at $650K.","options":[["That's way too high.",0,"Dismissive. They'll defend the number instead of listening."],["Let's look at what's sold nearby in the last six months, including your neighbor's, and what made each one different.",3,"You moved the conversation to facts without arguing."],["Sure, we can try $650K and see.",1,"Agreeable, but an overpriced listing can sit and lose momentum."]]},{"client":"But I need to get as much as possible.","options":[["So do I. Pricing it right is how we get there. Homes priced near the market draw more showings and better offers. Here's the range I'd recommend, and why.",3,"Aligned with their goal and backed with reasons."],["Then we'll just drop the price later if it doesn't sell.",0,"Planning a price cut from day one undercuts your credibility."],["Let me think about it.",1,"Buys time, but you came to recommend something."]]},{"client":"Fine. What happens next?","options":[["We'll figure it out as we go.",0,"Vague. Sellers want a plan."],["Call me when you're ready.",0,"Hands the momentum back to them."],["I'll send the listing agreement and a timeline today: photos this week, live next Monday.",3,"Specific, dated and easy to say yes to."]]}]},"s3":{"title":"A renter who went quiet","who":"Renter","skill":"followup","track":"rentals","intro":"Leo saw two listings six days ago and hasn't replied.","turns":[{"client":"(No reply for six days.) Which message do you send?","options":[["Just checking in!",0,"Easy to ignore. It gives him nothing new."],["Hi Leo, two new studios near the Jefferson St L stop just came up, both under $2,400 with every fee shown up front. Want me to set up viewings Thursday evening?",3,"Something new, specific and easy to answer."],["Are you still looking, or should I stop sending listings?",1,"Honest, but it can feel like pressure."]]},{"client":"Thursday doesn't work. I'm swamped this week.","options":[["These go fast, so you might miss out.",0,"Pressure tends to push people away."],["No problem. Would Saturday morning work, or should I check back next week?",3,"Respects his time and still offers a next step."],["Okay, let me know.",1,"Polite, but it leaves the next step to him."]]},{"client":"Saturday works.","options":[["Great. I'll send a confirmation with both addresses and times now.",3,"Locks it in while he's engaged."],["Cool.",0,"Missing the confirmation details."],["See you then.",1,"Friendly, but confirm the details in writing."]]}]},"s4":{"title":"A seller who asks you to cut your commission","who":"Seller","skill":"commission","track":"sales","intro":"A seller likes your plan, but another agent is offering a lower fee.","turns":[{"client":"Another agent said they'd do it for 4%. Can you match that?","options":[["Sure, I can match that.",0,"Agreeing straight away tells them your fee was never firm."],["I understand. Before we talk numbers, here's exactly what my fee covers: pricing from recent sales, professional photos and a floor plan, every showing handled and a weekly report. Then you can compare like for like.",3,"You kept it about value and gave them a fair way to compare."],["That agent probably isn't very good.",0,"Criticizing another agent costs you trust."]]},{"client":"It still feels like a lot of money.","options":[["Commissions are set by law, so there's nothing I can do.",0,"That isn't true. Commissions are negotiable, and saying otherwise can get you in real trouble."],["Let's look at it net. If my pricing and marketing get you even 2% more on the sale, you come out ahead after my fee. Here are the recent sales behind the price I'm recommending.",3,"You reframed the fee around their outcome and backed it with evidence."],["I could maybe do 4.5%.",1,"Splitting the difference without a reason weakens your position. If you adjust, tie it to a change in what you provide."]]},{"client":"Okay. What exactly do I get at your rate?","options":[["The usual: listing, showings, that kind of thing.",0,"Too vague. They can't tell what they're paying for."],["I'll explain once you sign.",0,"Asking for a signature before explaining breaks trust."],["Here it is in writing: the marketing plan, the timeline and the fee, with what happens at each step. If it looks right, we can sign today and list next week.",3,"Clear, written and paired with a next step, which is how Proxy handles fees."]]}]},"s5":{"title":"A seller with two competing offers","who":"Seller","skill":"negotiation","track":"sales","intro":"Your seller has two offers on a co-op: a higher one that depends on a mortgage, and a lower one in all cash.","turns":[{"client":"The higher offer is obviously better, right? Let's take it.","options":[["Yes, take the higher one.",0,"Price isn't the only term. Financing and board approval can sink a higher offer."],["It might be. Let's compare the full terms side by side: price, financing, the buyer's finances for the board package and the closing timeline.",3,"You compared terms, not just price, which is what protects your seller."],["Cash is always better.",1,"Often stronger, but \u201calways\u201d isn't advice. Show the trade-off."]]},{"client":"How do I know the higher buyer will get past the board?","options":[["Boards approve almost everyone.",0,"Not in many New York co-ops. Overpromising sets your seller up for a failed deal."],["We can't know for sure, but we can review their finances against the board's requirements before accepting, and ask their agent about their debt and the savings they'll have after closing.",3,"Specific and honest. You reduced the risk instead of guessing."],["That's the buyer's problem.",0,"A rejected buyer can cost your seller months, so it's your problem too."]]},{"client":"So what would you do?","options":[["Whatever you want.",0,"Your seller hired you for advice."],["Take the cash. It's less work for me.",0,"Never put your convenience ahead of your client's interest."],["Here's my recommendation in writing: ask the higher buyer to strengthen their terms, and keep the cash offer as a backup. It's your decision, and I'll give both buyers' agents the same deadline.",3,"A clear, written recommendation that's fair to both buyers and leaves the decision with the seller."]]}]}},"briefTags":["All","Rentals","Sales and buildings","Zoning and development"],"briefing":[{"tags":["Rentals"],"title":"The FARE Act was upheld on appeal","date":"July 13, 2026","changed":"A federal appeals court upheld the FARE Act, in effect since June 11, 2025. Landlords pay the brokers they hire, tenants pay only brokers they hire themselves, and tenant fees must be disclosed in listings and leases. Repeat violations can bring fines of up to $2,000.","means":"Lead landlord conversations with value, not the law. Disclose every tenant fee in writing, and never charge a tenant on a listing you market for a landlord.","sources":[["Courthouse News","https://www.courthousenews.com/landlords-lose-appeal-challenging-nyc-broker-fee-ban/"],["Habitat","https://www.thehabitatgroup.com/articles/print/9591-judge-clears-path-for-fare-act-implementation"]]},{"tags":["Rentals","Sales and buildings"],"title":"Rents are frozen for stabilized apartments","date":"June 25, 2026","changed":"The Rent Guidelines Board voted 7 to 1 to freeze rents on one- and two-year leases for about 1 million rent-stabilized apartments. The freeze covers leases starting October 1, 2026 through September 30, 2027, and it's the first ever on two-year leases. The board's own index put building operating costs up 5.3% this year.","means":"Stabilized renewals stay flat this year. If you're selling a building with stabilized units, expect buyers to underwrite flat rents against rising costs.","sources":[["NY1","https://ny1.com/nyc/all-boroughs/news/2026/06/25/nyc-rent-guidelines-board-final-vote"],["amNY","https://www.amny.com/housing/rent-guidelines-board-approves-rent-freeze-06262026/"]]},{"tags":["Rentals"],"title":"Good Cause Eviction: the 2026 rent standard is 8.38%","date":"Posted July 16, 2026, revised August 17","changed":"For market-rate apartments covered by Good Cause Eviction, an increase above the local rent standard is presumptively unreasonable. In New York City it's now 8.38%, which is inflation of 3.38% plus 5%, down from 8.79% last year.","means":"When a landlord client plans a renewal, check whether the unit is covered and keep the increase at or below 8.38%. Landlords also have to tell tenants whether Good Cause applies when they offer more than 5%.","sources":[["Rosenberg & Estis","https://www.rosenbergestis.com/media/blog/industry-updates/update-dhcr-revises-good-cause-eviction-law-notice"],["NYC HPD","https://www.nyc.gov/site/hpd/services-and-information/good-cause-eviction.page"]]},{"tags":["Zoning and development"],"title":"City of Yes for Housing Opportunity","date":"Adopted December 2024","changed":"The citywide zoning change sorts parking rules into three zones: no parking mandates in the Inner Transit Zone, reduced mandates in the Outer Transit Zone, and mostly unchanged rules beyond it. It allows accessory dwelling units with conditions, including that the owner lives on the lot, adds density for larger sites near transit, and lets conversions create a wider range of housing types.","means":"Some owners have development potential they don't know about, like an accessory unit or extra apartments near a station. Raise it as a question for their architect or zoning attorney rather than promising it.","sources":[["NYC Planning","https://www.nyc.gov/assets/planning/downloads/pdf/our-work/plans/citywide/city-of-yes-housing-opportunity/housing-opportunity-guide-parking.pdf?r=1"],["Rosenberg & Estis","https://www.rosenbergestis.com/blog/2024/11/important-update-city-of-yes-for-housing-opportunity-approved-key-changes-to-nyc-zoning"]]},{"tags":["Zoning and development"],"title":"Faster approvals for affordable housing","date":"Approved November 4, 2025","changed":"Voters approved three charter changes: a fast-track review for publicly funded affordable housing and for affordable projects in the 12 community districts that have built the least, a quicker review for modest housing and infrastructure, and an appeals board that can reverse City Council rejections of affordable housing. The city is still writing the rules that put them into effect.","means":"Affordable and mixed-income projects could move faster, especially in districts that have built little. That matters for land and development sales, so watch the rules as they're finalized.","sources":[["Cozen O'Connor","https://www.cozen.com/news-resources/news/2025/new-yorkers-approve-ballot-measures-focused-on-increasing-housing-production"],["Board of Standards and Appeals","https://www.nyc.gov/assets/bsa/downloads/pdf/bsa_tahp_rulemaking_2026.pdf"]]},{"tags":["Sales and buildings"],"title":"Local Law 97 enforcement has started","date":"2026","changed":"Buildings over 25,000 square feet must report emissions every year and stay under their limits, with penalties of $268 per metric ton over the limit each year. The city has started issuing notices and penalties for buildings that didn't comply in 2024, and electrification work finished by December 31, 2026 earns double credit.","means":"When you list or sell a larger building, ask for its emissions reports and any penalties. They can change what a buyer will pay.","sources":[["Rimkus","https://rimkus.com/article/what-is-nyc-local-law-97/"],["SiteCompli","https://sitecompli.com/blog/local-law-97-notices-of-deficiency-issued/"]]},{"tags":["Rentals","Sales and buildings"],"title":"Updated fair housing disclosure form","date":"Revised November 2025","changed":"New York revised its Housing and Anti-Discrimination Disclosure Form, which agents are required to give clients.","means":"Use the current version from the Department of State, and replace any old copies in your templates and email sequences.","sources":[["NY Department of State","https://dos.ny.gov/system/files/documents/2026/03/dos-2156-nys-housing-and-anti-discrimination-disclosure-form_11.2025.pdf"]]}],"articles":[["Landlords lose appeal challenging NYC broker fee ban","Courthouse News","July 2026","The appeals court sided with the city on the FARE Act.","https://www.courthousenews.com/landlords-lose-appeal-challenging-nyc-broker-fee-ban/"],["Rent Guidelines Board final vote","NY1","June 25, 2026","How the board reached a freeze on both one- and two-year leases.","https://ny1.com/nyc/all-boroughs/news/2026/06/25/nyc-rent-guidelines-board-final-vote"],["DHCR revises Good Cause Eviction notice","Rosenberg & Estis","August 19, 2026","Why the state reposted this year's 8.38% standard with a new date.","https://www.rosenbergestis.com/media/blog/industry-updates/update-dhcr-revises-good-cause-eviction-law-notice"],["Good Cause law puts the brakes on rent hikes","Hoodline","April 29, 2026","Large market-rate renewal increases have fallen since the law took effect.","https://hoodline.com/2026/04/good-cause-law-puts-the-brakes-on-nyc-s-brutal-rent-hikes/"],["Ballot measures to increase housing production","Cozen O'Connor","November 6, 2025","What the three housing charter changes do, and what comes next.","https://www.cozen.com/news-resources/news/2025/new-yorkers-approve-ballot-measures-focused-on-increasing-housing-production"],["Local Law 97 notices of deficiency issued","SiteCompli","2026","The first enforcement notices and what owners should do about them.","https://sitecompli.com/blog/local-law-97-notices-of-deficiency-issued/"]],"quizzes":{"q-onb":{"title":"Proxy process check","skill":"rentals","questions":[{"q":"You're moving your license to Proxy. Who files the change of association in eAccessNY?","o":["You do, from your own account","Proxy does, after your previous broker files the termination","The Department of State does it automatically"],"a":1,"e":"Your previous broker terminates the association, then Proxy, as your new sponsoring broker, files the change of association."},{"q":"When do you give a prospective client the agency disclosure and the Housing and Anti-Discrimination Disclosure?","o":["At first substantive contact","When they sign a lease or contract","Only if they ask for them"],"a":0,"e":"Both are due at first substantive contact, before you get into the details of their search or sale."},{"q":"Proxy's operating procedures require ID before showings. How do you apply them?","o":["Only to buyers who seem less serious","The same way for every buyer and renter","However each agent prefers"],"a":1,"e":"New York requires brokerages to have written procedures, and agents must apply them the same way to everyone."},{"q":"You post a listing on Instagram. What must the post include?","o":["Just the price and photos","Your name and license type, Proxy's name and the office phone","Only Proxy's logo"],"a":1,"e":"Social media posts count as ads under New York's rules, so they need the same details as any other ad."},{"q":"A seller asks whether commissions are set by law. What's the right answer?","o":["Yes, the state sets them","No, commissions are negotiable","Only for rentals"],"a":1,"e":"Commissions are always negotiable. Saying otherwise can get you in real trouble."},{"q":"A lease is signed on an apartment Proxy listed for the landlord. Who pays the broker fee, and what do you do next?","o":["The landlord pays, and you submit a commission slip within a day","The tenant pays, and you submit a slip at month end","They split it, and Ryan files the slip"],"a":0,"e":"Under the FARE Act the landlord pays the broker it hired. Proxy's process is to submit the slip within a day of signing."}]},"q-rules":{"title":"Rules and zoning check","skill":"market","questions":[{"q":"A landlord hires you to rent out an apartment. Under the FARE Act, who pays your fee?","o":["The tenant","The landlord","They split it 50/50"],"a":1,"e":"Whoever hires the broker pays, and an appeals court upheld the law in July 2026."},{"q":"What did the Rent Guidelines Board decide for stabilized leases starting October 1, 2026?","o":["Increases of 3% and 4.5%","A freeze on one- and two-year leases","A 2% cap on all leases"],"a":1,"e":"It set 0% for both, the first freeze ever on two-year leases."},{"q":"For a market-rate apartment covered by Good Cause Eviction in NYC, which renewal increase is presumptively unreasonable in 2026?","o":["Anything over 5%","Anything over 8.38%","Anything over 10%"],"a":1,"e":"The 2026 standard is 8.38%: inflation of 3.38% plus 5%. The 5% figure is when landlords must tell tenants whether Good Cause applies."},{"q":"Under City of Yes, how much parking must a new building in the Inner Transit Zone include?","o":["None","Enough for 25% of units","Enough for 50% of units"],"a":0,"e":"There are no parking mandates in the Inner Transit Zone. The Outer Transit Zone has reduced mandates, and beyond it most rules remain."},{"q":"You're selling a 60,000-square-foot apartment building. Which law should you ask the owner about?","o":["Local Law 97","Good Cause Eviction only","Neither"],"a":0,"e":"Buildings over 25,000 square feet face annual emissions limits, and penalties of $268 per ton over the limit can affect value."}]}},"canned":[{"keys":["fare","fee","landlord","pay a broker"],"q":"How do I explain the FARE Act to a landlord?","a":"Keep it to one line, then move to value: \u201cUnder the FARE Act, whoever hires the broker pays.\u201d Then explain how you'll fill their units, and put your fee in writing. Avoid suggesting they raise the rent to cover it.","src":"Proxy playbook (sample) and NYC's FARE Act, in effect since June 11, 2025"},{"keys":["seller","wait","price","overprice","chris"],"q":"What do I say to a seller who wants to wait?","a":"Ask what's behind the wait first. If it's price, show recent sales near them. If it's timing, agree on a date to revisit, and send a short market update before then.","src":"Proxy playbook (sample)"},{"keys":["follow","quiet","ghost","reply","leo"],"q":"Write a follow-up for a renter who went quiet","a":"Send something new instead of a check-in: \u201cHi Leo, two new studios near the Jefferson St L stop just came up, both under $2,400 with every fee shown up front. Want to see them Saturday morning?\u201d It's also waiting in Follow-ups.","src":"Your pipeline: Leo B., no reply in 6 days"},{"keys":["slip","get paid","paid","commission"],"q":"How do I submit a commission slip?","a":"Open Commission slips, enter the deal and attach the signed lease or contract. Your split and fees come from your commission plan, so you see your share before you submit. Ryan approves it, and you can track it until it's paid.","src":"Proxy's commission process (sample)"},{"keys":["listing","advert"," ad "," ads ","compliant"],"q":"What has to be in a listing ad?","a":"Your name and license type, Proxy's name and the office phone, and the price. For rentals, say who pays the broker fee and list any other tenant fees. Describe the home, never who should live there. The listing builder checks all of this before Ryan approves it.","src":"New York advertising rules (19 NYCRR 175.25), the FARE Act and Proxy's listing process (sample)"},{"keys":["rule","zoning","changed","city of yes","rent freeze","good cause","law 97"],"q":"What's changed in the rules this year?","a":"For rentals: the FARE Act was upheld on appeal, stabilized leases starting October 1 are frozen, and the Good Cause rent standard for 2026 is 8.38%. For sales: ask owners of buildings over 25,000 square feet about Local Law 97, and look at City of Yes for new development potential. The full briefing is under Practice, in Rules and zoning.","src":"Rules and zoning briefing, updated October 2026"},{"keys":["how many","calls","pace","today","goal"],"q":"How many calls should I make today?","a":"{pace}","src":"Your weekly goals and logged calls"}]}</script>
<script>
(function () {
  "use strict";

  // ---------------- data and tuning
  // Everything the page shows comes from proxy_coach/data.py, embedded by build.py as JSON.
  var DATA = JSON.parse(document.getElementById("page-data").textContent);
  var T = DATA.tuning;
  var TOAST_MS = T.toastMs, DAYS_LEFT_IN_WEEK = T.daysLeftInWeek, ON_PACE_SHARE = T.onPaceShare,
    HOT_LEAD_MINUTES = T.hotLeadMinutes, STALE_DAYS = T.staleDays, STRONG_SCORE = T.strongScore,
    MAX_LEVEL = T.maxLevel, BUSY_LISTING_INQUIRIES = T.busyListingInquiries;

  // ---------------- helpers
  function el(tag, props) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, "");
      else n.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) add(n, arguments[i]);
    return n;
  }
  function add(n, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { add(n, k); }); return; }
    n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  function $(id) { return document.getElementById(id); }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function first(name) { return name.split(" ")[0]; }
  function clamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
  function sentence(text) { return /[.!?]$/.test(text) ? text : text + "."; }
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, TOAST_MS);
  }
  // Resolves true when the text reached the clipboard. Some app views refuse clipboard writes.
  function copyText(text) {
    try {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
    } catch (e) { return Promise.resolve(false); }
  }
  // One labeled input bound to state[key]; onChange(key) runs after every edit.
  function formField(state, prefix, onChange, label, key, type, opts, full, hint) {
    var input;
    if (opts) {
      input = el("select", { id: prefix + key });
      opts.forEach(function (o) { var op = el("option", { value: o[0], text: o[1] }); if (String(state[key]) === o[0]) op.selected = true; input.appendChild(op); });
      input.addEventListener("change", function () { state[key] = input.value; onChange(key); });
    } else {
      input = el(type === "area" ? "textarea" : "input", { id: prefix + key, type: type === "area" ? null : type, style: type === "area" ? "min-height:4.5rem" : null });
      input.value = state[key] || "";
      input.addEventListener("input", function () { state[key] = input.value; onChange(key); });
    }
    return el("div", { class: full ? "full" : "" }, el("label", { for: prefix + key, text: label }), input, hint ? el("div", { class: "hint", text: hint }) : null);
  }

  // ---------------- state
  var STAGES = DATA.stages, SKILLS = DATA.skills, LEVELS = DATA.levels, SOURCE_PHRASES = DATA.sourcePhrases;
  function copy(x) { return JSON.parse(JSON.stringify(x)); }
  // A fresh demo state; "Reset demo" calls this again.
  function seed() { var s = copy(DATA.seed); s.slipForm = blankSlip(); return s; }
  function blankSlip() { return copy(DATA.blankSlip); }
  var S = seed();
  function client(id) { return S.clients.filter(function (c) { return c.id === id; })[0]; }
  function srcPhrase(src) {
    if (SOURCE_PHRASES[src]) return SOURCE_PHRASES[src];
    if (src.indexOf("Meta ad") === 0) return "a Meta ad";
    return src.charAt(0).toLowerCase() + src.slice(1);
  }
  // "250 Demo Avenue, Queens, Unit 2B", or just the address when there's no unit
  function where(l) { return l.address + (l.unit ? ", Unit " + l.unit : ""); }

  var ONBOARDING = DATA.onboarding;
  function onboardingCount() {
    var t = 0, d = 0;
    ONBOARDING.forEach(function (ph) { ph.items.forEach(function (it) { t++; if (S.onboarding[it.id]) d++; }); });
    return { done: d, total: t };
  }

  var LESSONS = DATA.lessons;

  // ---------------- money: listings and commission slips
  // "$2,950" or "-$32"; a sum that rounds to zero is "$0", never "$-0".
  function money(x) { var r = Math.round(x); return (r < 0 ? "-$" : "$") + Math.abs(r).toLocaleString("en-US"); }
  // Percentages are clamped to 0-100 and the fee to 0 or more, so the preview never shows impossible payouts.
  function slipNumbers(gross, cobroke, referral, split, fee) {
    cobroke = clamp(cobroke, 0, 100); referral = clamp(referral, 0, 100); split = clamp(split, 0, 100); fee = Math.max(0, fee);
    var co = gross * cobroke / 100;
    var ref = (gross - co) * referral / 100;
    var side = gross - co - ref;
    var share = side * split / 100;
    var you = Math.max(0, share - fee);
    return { gross: gross, co: co, ref: ref, side: side, share: share, fee: fee, you: you, proxy: side - you };
  }
  function slipYou(k) { return slipNumbers(k.gross, k.cobroke, k.referral, k.split, k.fee).you; }
  function formGross(f) {
    var price = Number(f.price) || 0, val = Number(f.value) || 0;
    if (f.basis === "month") return price * val;
    if (f.basis === "pct-year") return price * 12 * val / 100;
    if (f.basis === "pct-price") return price * val / 100;
    return val;
  }
  var FAIR_HOUSING = DATA.fairHousing;
  var AD_FOOTER = DATA.adFooter;
  function bedsText(b) { return b === "0" ? "Studio" : b + "-bedroom"; }
  function draftDescription(b) {
    var price = Number(b.price) || 0;
    var parts = [];
    if (b.type === "Rental") {
      parts.push(bedsText(b.beds) + ", " + b.baths + "-bath apartment at " + where(b) + ".");
      if (b.highlights) parts.push("It has " + b.highlights + ".");
      if (b.notes) parts.push(b.notes.replace(/\.$/, "") + ".");
      parts.push("Rent: " + money(price) + " a month.");
      parts.push(b.payer === "landlord" ? "No broker fee for tenants; the landlord pays the listing broker." : "The tenant pays the broker fee.");
      parts.push(b.otherFees ? "Other tenant fees: " + b.otherFees.replace(/\.$/, "") + "." : "No other tenant fees.");
    } else {
      parts.push(bedsText(b.beds) + ", " + b.baths + "-bath home for sale at " + where(b) + ".");
      if (b.highlights) parts.push("It has " + b.highlights + ".");
      if (b.notes) parts.push(b.notes.replace(/\.$/, "") + ".");
      parts.push("Asking price: " + money(price) + ".");
    }
    return parts.join(" ") + "\n\n" + AD_FOOTER;
  }
  function listingChecks(b) {
    var text = (b.highlights + " " + b.notes + " " + b.desc).toLowerCase();
    var hits = FAIR_HOUSING.filter(function (f) { return text.indexOf(f[0]) !== -1; });
    var out = [];
    out.push({ ok: hits.length === 0, title: "Fair housing language", msg: hits.length ? hits.map(function (h) { return "\u201c" + h[0] + "\u201d: " + h[1]; }).join(" ") : "Describes the home, not who should live there." });
    if (b.type === "Rental") out.push({ ok: b.payer === "landlord", title: "Broker fee rules (FARE Act)", msg: b.payer === "landlord" ? "States that tenants pay no broker fee, and lists other tenant fees." : "You're listing this apartment for the landlord, so the tenant can't be charged a broker fee." });
    else out.push({ ok: true, title: "Broker fee rules (FARE Act)", msg: "Not a rental, so the FARE Act doesn't apply." });
    out.push({ ok: !!b.desc && b.desc.indexOf("Proxy Real Estate") !== -1 && b.desc.indexOf("Licensed Real Estate Salesperson") !== -1, title: "Advertising rules", msg: "Needs your name, license type, Proxy's name and the office phone. The builder adds them when it drafts the description." });
    out.push({ ok: (Number(b.price) || 0) > 0, title: "Price", msg: "Every listing needs a price." });
    out.push({ ok: !!b.address.trim(), title: "Address", msg: "Every listing needs an address." });
    out.push({ ok: !!b.docs.agreement, title: "Listing agreement signed", msg: "Your authorization to advertise the property." });
    out.push({ ok: !!b.docs.agency, title: "Agency disclosure given to the owner", msg: "Required at first substantive contact." });
    out.push({ ok: !!b.docs.photos, title: "Photos and floor plan", msg: "Add them before it goes live." });
    return out;
  }
  function pill(status) {
    var cls = /Live|Paid|Approved/.test(status) ? "good" : /Waiting|Submitted/.test(status) ? "wait" : /Sent back/.test(status) ? "bad" : "";
    return el("span", { class: "pill " + cls, text: status });
  }

  // ---------------- call prep, written per client in data.py (validate.py makes sure every client has one)
  function prep(c) { return DATA.prep[c.id]; }

  // ---------------- practice, briefing and quizzes
  var SCENARIOS = DATA.scenarios, BRIEF_TAGS = DATA.briefTags, BRIEFING = DATA.briefing, ARTICLES = DATA.articles, QUIZZES = DATA.quizzes;

  // ---------------- navigation
  var SCREENS = DATA.screens;
  // Nav groups, in the order their first screen appears
  var GROUPS = SCREENS.map(function (s) { return s.group; }).filter(function (g, i, all) { return all.indexOf(g) === i; });
  // Everything waiting on Ryan: listings to approve, slips to approve and approved slips to pay.
  function managerQueueCount() {
    return S.listings.filter(function (l) { return l.status === "Waiting for approval"; }).length +
      S.slips.filter(function (k) { return k.status === "Submitted" || k.status === "Approved"; }).length;
  }
  function navCount(id) {
    if (id === "today") return S.tasks.filter(function (t) { return !t.done; }).length;
    if (id === "followups") return S.drafts.length;
    if (id === "listings") return S.listings.filter(function (l) { return l.status === "Draft" || l.status === "Sent back"; }).length;
    if (id === "team") return managerQueueCount();
    return 0;
  }

        el("div", { class: "row" },
          el("button", { type: "button", class: "btn small", onclick: function () { l.status = "Live"; l.days = 0; l.inquiries = 0; S.onboarding.o13 = true; toast("Published: " + where(l)); render(); } }, "Approve and publish"),
          el("button", { type: "button", class: "btn quiet small", onclick: function () { l.status = "Sent back"; toast("Sent back to Jamie"); render(); } }, "Send back"))));
    });
    S.slips.filter(function (k) { return k.status === "Submitted" || k.status === "Approved"; }).forEach(function (k) {
      var nums = slipNumbers(k.gross, k.cobroke, k.referral, k.split, k.fee);
      box.appendChild(el("div", { class: "approval" },
        el("div", null, el("strong", { text: "Commission slip: " + k.deal }), el("div", { class: "fine", text: "Jamie L., signed " + k.signed + ". Gross " + money(nums.gross) + ", Jamie receives " + money(nums.you) + ", Proxy keeps " + money(nums.proxy) + ". " + (k.status === "Approved" ? "Approved, waiting for payment." : "Documents attached.") })),
        k.status === "Submitted" ? el("div", { class: "row" },
          el("button", { type: "button", class: "btn small", onclick: function () { k.status = "Approved"; toast("Approved: " + k.deal); render(); } }, "Approve"),
          el("button", { type: "button", class: "btn quiet small", onclick: function () { k.status = "Sent back"; toast("Sent back to Jamie"); render(); } }, "Send back")) :
          el("div", { class: "row" }, el("button", { type: "button", class: "btn small", onclick: function () { k.status = "Paid"; toast("Marked as paid: " + k.deal); render(); } }, "Mark as paid"))));
    });
    v.appendChild(box);

    v.appendChild(el("h2", { text: "Each agent's week" }));
    var rows = [
      ["Jamie L.", "3 weeks", S.stats.conversations, S.stats.appointments, m.live, S.stats.deals, money(m.waiting), oc.done + " of " + oc.total + " steps"],
      ["Taylor B.", "2 years", 31, 7, 4, 2, "$3,840", "Done"],
      ["Morgan C.", "6 weeks", 9, 1, 0, 0, "$0", "Disclosure forms not set up"],
      ["Riley P.", "1 year", 22, 5, 2, 1, "$1,900", "Done"]
    ];
    var tb = el("tbody");
    rows.forEach(function (r) { tb.appendChild(el("tr", null, r.map(function (c, i) { return el("td", { class: i >= 2 && i <= 6 ? "num" : "", text: String(c) }); }))); });
    v.appendChild(el("div", { class: "tablewrap" }, el("table", { class: "data" },
      el("thead", null, el("tr", null, ["Agent", "With Proxy", "Conversations", "Appointments", "Live listings", "Deals", "Commission waiting", "Onboarding"].map(function (h) { return el("th", { text: h }); }))), tb)));

    v.appendChild(el("h2", null, "Where to step in", el("span", { class: "badge ai", text: "AI coach" })));
    var tips = [];
    if (n) tips.push(n + (n === 1 ? " item is" : " items are") + " waiting on you. Agents get paid and listings go live faster when these clear within a day.");
    tips.push("Morgan C. hasn't logged a call in three days and hasn't set up disclosure forms. A short check-in this morning could get the week back on track.");
    tips.push("Riley P.'s follow-ups slipped to 48 hours. Suggest the follow-up practice round.");
    tips.push("Jamie L. has a listing presentation tomorrow, and the seller may push on commission. Point Jamie to the commission practice round.");
    v.appendChild(el("ul", { class: "tight coach" }, tips.map(function (t) { return el("li", { text: t }); })));

    v.appendChild(el("h2", null, "Agenda for this week's team meeting", el("span", { class: "badge ai", text: "AI coach" })));
    v.appendChild(el("div", { class: "panel" },
      el("p", { class: "coach" }, "Wins: Taylor B. signed two deals, and Jamie L.'s live listings drew " + m.inquiries + " inquiries."),
      el("p", { class: "coach", text: "Needs attention: Morgan C.'s activity and onboarding, and follow-up speed across the team." }),
      el("p", { class: "coach", style: "margin:0", text: "Focus for next week: reply to every new lead within the hour and send every follow-up within 24 hours." })));
  }

  // ---------------- coach chat
  // A question matches an answer when it contains one of its keys, after punctuation becomes spaces
  // (so " ad " is a whole word). "{pace}" stands for the live pace line.
  var CANNED = DATA.canned;
  function answer(text) {
    var t = " " + text.toLowerCase().replace(/[^a-z0-9]+/g, " ") + " ";
    var hit = CANNED.filter(function (c) { return c.keys.some(function (k) { return t.indexOf(k) !== -1; }); })[0];
    if (hit) return { text: hit.a === "{pace}" ? paceLine() : hit.a, src: hit.src };
    return { text: "I can help with call prep, objections, follow-ups and your weekly pace. In the full version, Claude answers from Proxy's playbook and your own pipeline. Try one of the suggested questions.", src: "" };
  }
  function renderChat() {
    var m = $("msgs"); clear(m);
    S.chat.forEach(function (x) { m.appendChild(el("div", { class: "msg " + (x.from === "coach" ? "coach" : "me") }, x.text, x.src ? el("span", { class: "src", text: "Based on: " + x.src }) : null)); });
    m.scrollTop = m.scrollHeight;
    var chips = $("chips"); clear(chips);
    CANNED.forEach(function (c) { chips.appendChild(el("button", { type: "button", onclick: function () { ask(c.q); } }, c.q)); });
  }
  function ask(q) {
    S.chat.push({ from: "me", text: q, src: "" });
    var a = answer(q);
    S.chat.push({ from: "coach", text: a.text, src: a.src });
    renderChat();
  }
  $("askForm").addEventListener("submit", function (e) { e.preventDefault(); var q = $("askInput").value.trim(); if (!q) return; $("askInput").value = ""; ask(q); });
  var lastFocus = null;
  function openCoach() { lastFocus = document.activeElement; $("drawer").hidden = false; renderChat(); $("askInput").focus(); }
  function closeCoach() { $("drawer").hidden = true; if (lastFocus) lastFocus.focus(); }
  $("openCoach").addEventListener("click", openCoach);
  $("closeCoach").addEventListener("click", closeCoach);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("drawer").hidden) closeCoach(); });

  // ---------------- role and reset
  $("role").addEventListener("change", function (e) { go(e.target.value === "manager" ? "team" : "today"); });
  $("reset").addEventListener("click", function () { S = seed(); closeCoach(); go("today"); toast("Demo reset to the sample data."); });

  // ---------------- render
  var VIEWS = { today: viewToday, pipeline: viewPipeline, prep: viewPrep, practice: viewPractice, followups: viewFollowups, listings: viewListings, slips: viewSlips, onboarding: viewOnboarding, review: viewReview, team: viewTeam };
  function render() {
    renderNav();
    var v = $("view"); clear(v);
    VIEWS[S.screen](v);
    if (!$("drawer").hidden) renderChat();
  }
  render();
})();
</script>
